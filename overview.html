<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Presentation Collage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #e2e8f0; 
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(500px, 1fr)); 
            gap: 30px;
            max-width: 1600px;
            width: 100%;
        }

        .image-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 12px;
            border-bottom: 3px solid #1a73e8; 
            width: 100%;
            text-align: center;
        }

        .image-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            align-self: flex-start; 
            
            /* --- NEW ZOOM EFFECT CSS --- */
            transition: all 0.3s ease-in-out; /* Makes the zoom animation smooth */
            transform-origin: top center; /* Ensures it zooms out from the top so it doesn't cover the title */
            position: relative;
            z-index: 1;
        }

        /* What happens when the cursor hovers over the image */
        .image-card img:hover {
            transform: scale(1.4); /* Zooms the image to 140% of its size */
            z-index: 50; /* Brings the zoomed image to the very front */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* Adds a deep shadow to separate it from the background */
            cursor: zoom-in; /* Changes your cursor icon */
        }
    </style>
</head>
<body>

    <div class="collage-grid">
        <!-- 1. Secure Login Page -->
        <div class="image-card">
            <div class="image-title">Secure Authentication Portal</div>
            <img src="file:///C:/Users/rahul/Desktop/team-call-tracker/login.png" alt="Login Page">
        </div>

        <!-- 2. Agent Dashboard (Desktop) -->
        <div class="image-card">
            <div class="image-title">Agent Portal - Desktop View</div>
            <img src="file:///C:/Users/rahul/Desktop/team-call-tracker/agent.png" alt="Agent Dashboard">
        </div>

        <!-- 3. Agent Dashboard (Vertical/Scroll View) -->
        <div class="image-card">
            <div class="image-title">Agent Portal - Full Layout</div>
            <img src="file:///C:/Users/rahul/Desktop/team-call-tracker/agent long.png" alt="Agent Long View">
        </div>

        <!-- 4. Manager Analytics Dashboard -->
        <div class="image-card">
            <div class="image-title">Manager Command Center</div>
            <img src="file:///C:/Users/rahul/Desktop/team-call-tracker/dashboard.png" alt="Manager Dashboard">
        </div>
    </div>

</body>
</html>
